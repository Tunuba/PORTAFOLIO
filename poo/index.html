<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Camiones — demo POO</title>
<style>
  :root{--fondo:#eef1f5;--panel:#fff;--borde:#d4d9e2;--texto:#232732;--tenue:#6b7280;--azul:#2456c9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);font-family:Segoe UI,system-ui,sans-serif;}
  .login-pantalla{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login-caja{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:32px;width:320px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  .login-caja h1{font-size:18px;margin:0 0 4px;text-align:center}
  .login-caja p{font-size:12px;color:var(--tenue);text-align:center;margin:0 0 20px}
  .login-caja input{width:100%;padding:10px;border:1px solid var(--borde);border-radius:6px;margin-bottom:10px;font-size:13px}
  .login-caja button{width:100%;background:var(--azul);color:#fff;border:none;padding:10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
  .login-caja .demo-nota{font-size:11px;color:var(--tenue);text-align:center;margin-top:12px}
  .app{display:none}
  .app.activa{display:grid}
  .app{grid-template-columns:210px 1fr;min-height:100vh}
  aside{background:#1c2333;color:#c9cedb;padding:16px 0}
  aside .marca{color:#fff;font-weight:700;font-size:15px;padding:0 18px 16px;border-bottom:1px solid #313a52;margin-bottom:10px}
  aside button{display:block;width:100%;text-align:left;background:transparent;border:none;color:#c9cedb;padding:10px 18px;font-size:13px;cursor:pointer}
  aside button.on{background:#2a3350;color:#fff;border-left:3px solid #4d7cff}
  main{padding:22px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .top h1{font-size:19px;margin:0}
  .top .usuario{font-size:12px;color:var(--tenue)}
  .toolbar{display:flex;gap:8px;margin-bottom:14px}
  .toolbar button{background:var(--azul);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
  .toolbar input{border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-size:12px;width:200px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--borde);border-radius:8px;overflow:hidden}
  th{background:#f4f6f9;text-align:left;font-size:11px;text-transform:uppercase;color:var(--tenue);padding:10px 12px;border-bottom:1px solid var(--borde)}
  td{padding:10px 12px;font-size:13px;border-bottom:1px solid #eef0f3}
  tr:last-child td{border-bottom:none}
  tr.nueva{animation:entra .4s ease}
  @keyframes entra{from{background:#e7f0ff}to{background:transparent}}
  .estado{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
  .estado.disponible{background:#dcfce7;color:#15803d}
  .estado.ruta{background:#fef3c7;color:#92400e}
  .estado.taller{background:#fee2e2;color:#b91c1c}
  footer{font-size:11px;color:var(--tenue);margin-top:16px;display:flex;justify-content:space-between}
  footer a{color:var(--azul);text-decoration:none}
</style>
</head>
<body>
<div class="login-pantalla" id="pantalla-login">
  <div class="login-caja">
    <h1>Sistema de Transporte</h1>
    <p>Gestión de camiones, clientes y pedidos</p>
    <input type="text" placeholder="Usuario" value="admin">
    <input type="password" placeholder="Contraseña" value="••••••">
    <button id="btn-login">Ingresar</button>
    <div class="demo-nota">Demo del portafolio — cualquier click entra, no valida nada real</div>
  </div>
</div>

<div class="app" id="app">
  <aside>
    <div class="marca">🚚 TransSystem</div>
    <button class="on" data-v="camiones">Camiones</button>
    <button data-v="clientes">Clientes</button>
    <button data-v="pedidos">Pedidos</button>
    <button data-v="creditos">Créditos</button>
    <button data-v="ventas">Ventas</button>
    <button data-v="trabajadores">Trabajadores</button>
  </aside>
  <main>
    <div class="top">
      <h1 id="titulo-vista">Camiones</h1>
      <div class="usuario">Conectado como <b>admin</b></div>
    </div>
    <div class="toolbar">
      <button id="btn-agregar">+ Agregar</button>
      <input type="text" placeholder="Buscar...">
    </div>
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <footer>
      <span>Maqueta del portafolio, inspirada en el proyecto real (Java, NetBeans, Excel como almacen de datos).</span>
      <a href="../index.html">← volver al portafolio</a>
    </footer>
  </main>
</div>

<script>
document.getElementById('btn-login').addEventListener('click', () => {
  document.getElementById('pantalla-login').style.display = 'none';
  document.getElementById('app').classList.add('activa');
});

const vistas = {
  camiones: {
    cols: ['Placa', 'Modelo', 'Capacidad', 'Estado'],
    filas: [
      ['C-14RTX', 'Volvo FH16', '18 ton', 'disponible'],
      ['C-08KLP', 'Freightliner Cascadia', '22 ton', 'ruta'],
      ['C-21MNB', 'Kenworth T680', '20 ton', 'disponible'],
      ['C-03QWE', 'International LT', '16 ton', 'taller'],
    ],
    estadoCol: 3,
    nueva: ['C-99NEW', 'Scania R450', '19 ton', 'disponible'],
  },
  clientes: {
    cols: ['Nombre', 'NIT', 'Teléfono', 'Créditos activos'],
    filas: [
      ['Distribuidora Los Consentidos', '4521878-K', '5511-2233', '2'],
      ['Ferretería El Tornillo', '8812340-1', '4022-9988', '0'],
      ['Abarrotería Santa Rosa', '2201567-9', '3399-4477', '1'],
    ],
    nueva: ['Cliente Nuevo S.A.', '0000000-0', '0000-0000', '0'],
  },
  pedidos: {
    cols: ['Folio', 'Cliente', 'Fecha', 'Estado'],
    filas: [
      ['PED-1042', 'Ferretería El Tornillo', '2026-09-18', 'ruta'],
      ['PED-1041', 'Abarrotería Santa Rosa', '2026-09-17', 'disponible'],
      ['PED-1039', 'Distribuidora Los Consentidos', '2026-09-15', 'disponible'],
    ],
    estadoCol: 3,
    nueva: ['PED-1043', 'Cliente Nuevo S.A.', new Date().toISOString().slice(0,10), 'ruta'],
  },
  creditos: {
    cols: ['Cliente', 'Monto', 'Vence', 'Estado'],
    filas: [
      ['Distribuidora Los Consentidos', 'Q12,400.00', '2026-10-01', 'ruta'],
      ['Abarrotería Santa Rosa', 'Q3,200.00', '2026-09-25', 'disponible'],
    ],
    estadoCol: 3,
    nueva: ['Cliente Nuevo S.A.', 'Q1,000.00', '2026-11-01', 'disponible'],
  },
  ventas: {
    cols: ['Folio', 'Cliente', 'Total', 'Fecha'],
    filas: [
      ['V-3301', 'Ferretería El Tornillo', 'Q4,820.00', '2026-09-19'],
      ['V-3300', 'Distribuidora Los Consentidos', 'Q9,150.00', '2026-09-18'],
    ],
    nueva: ['V-3302', 'Cliente Nuevo S.A.', 'Q2,000.00', new Date().toISOString().slice(0,10)],
  },
  trabajadores: {
    cols: ['Nombre', 'Puesto', 'Turno', 'Estado'],
    filas: [
      ['Carlos Ramírez', 'Piloto', 'Diurno', 'disponible'],
      ['Ana López', 'Despachadora', 'Diurno', 'disponible'],
      ['Marco Tul', 'Piloto', 'Nocturno', 'ruta'],
    ],
    estadoCol: 3,
    nueva: ['Empleado Nuevo', 'Piloto', 'Diurno', 'disponible'],
  },
};

function pintar(v) {
  const datos = vistas[v];
  document.getElementById('titulo-vista').textContent = v.charAt(0).toUpperCase() + v.slice(1);
  document.getElementById('thead').innerHTML = '<tr>' + datos.cols.map(c => `<th>${c}</th>`).join('') + '<th></th></tr>';
  pintarFilas(datos);
}
function pintarFilas(datos, nueva) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = datos.filas.map((f) => filaHtml(f, datos.estadoCol)).join('');
  if (nueva) {
    const tr = tbody.lastElementChild;
    if (tr) tr.classList.add('nueva');
  }
}
function filaHtml(f, estadoCol) {
  return '<tr>' + f.map((v, i) => {
    if (i === estadoCol) return `<td><span class="estado ${v}">${v === 'disponible' ? 'Disponible' : v === 'ruta' ? 'En ruta' : 'Taller'}</span></td>`;
    return `<td>${v}</td>`;
  }).join('') + '<td style="color:#94a3b8;font-size:12px">editar</td></tr>';
}

let vistaActual = 'camiones';
pintar(vistaActual);

document.querySelectorAll('aside button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('aside button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    vistaActual = b.dataset.v;
    pintar(vistaActual);
  });
});

document.getElementById('btn-agregar').addEventListener('click', () => {
  const datos = vistas[vistaActual];
  datos.filas.push(datos.nueva.slice());
  pintarFilas(datos, true);
});
</script>
</body>
</html>
